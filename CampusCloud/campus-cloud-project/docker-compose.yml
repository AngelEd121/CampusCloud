services:

  #==================================
  # POSTGRESQL
  #==================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud-nwt

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #==================================
  # PGADMIN
  #==================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud-nwt

  #==================================
  # SQL SERVER
  #==================================
  sqlserver-cloud:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DB: ${MSSQL_DB}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - campuscloud-nwt

  #==================================
  # MONGODB
  #==================================
  mongodb-cloud:
    image: mongo:8.0.8-noble
    container_name: campuscloud-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campuscloud-nwt

  #==================================
  # NEO4J
  #==================================
  neo4j:
    image: neo4j:5-community
    container_name: campuscloud-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - campuscloud-nwt


  #==================================
  # CASSANDRA
  #==================================
  cassandra:
    image: cassandra:5.0
    container_name: campuscloud-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_DC: ${CASSANDRA_DC}
      CASSANDRA_RACK: ${CASSANDRA_RACK}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "127.0.0.1:${CASSANDRA_PORT}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - campuscloud-nwt
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s


#==================================
# VOLUMENES
#==================================
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME}

  pgadmin_data:
    name: ${PGADMIN_VOLUME}

  sqlserver_data:
    name: ${SQLSERVER_VOLUME}

  mongo_data:
    name: ${MONGO_VOLUME}

  neo4j_data:
    name: ${NEO4J_VOLUME}
  
  cassandra_data:
    name: ${CASSANDRA_VOLUME}


#==================================
# RED
#==================================
networks:
  campuscloud-nwt:
    external: true
    name: ${DOCKER_NETWORK}